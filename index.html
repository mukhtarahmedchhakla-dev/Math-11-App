<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V9 Live - Rs.10 Lagao Rs.18 Jeeto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:10px}
.header{background:linear-gradient(90deg,#ff0000,#ffcc00);padding:12px;border-radius:10px;font-weight:bold;font-size:20px;color:#000}
.live-badge{background:#00ff00;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;display:inline-block;margin:8px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.balance-box{background:#1a1a1a;border:2px solid #ffcc00;padding:12px;border-radius:10px;margin:10px 0;font-size:18px}
.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.num-btn{background:#222;border:2px solid #444;padding:18px 0;border-radius:12px;font-size:22px;font-weight:bold;color:#fff;cursor:pointer}
.num-btn.selected{background:#ffcc00;color:#000;border-color:#ffcc00;transform:scale(1.05)}
.num-btn.win{background:#00ff00;color:#000;border-color:#00ff00;box-shadow:0 0 15px #00ff00}
.bet-btn{background:linear-gradient(90deg,#ff0000,#ff6600);color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-size:18px;font-weight:bold;margin:10px 0;cursor:pointer}
.result-box{background:#111;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #333;min-height:60px}
</style>
</head>
<body>

<div class="header">🔥 V9 LIVE GAME 🔥</div>
<div class="live-badge">● LIVE</div>

<div class="balance-box">
Balance: Rs.<span id="balance">100</span>
</div>

<div class="result-box" id="resultBox">
Naya Game Shuru - Number Chuno BOSS!
</div>

<div class="number-grid" id="grid"></div>

<button class="bet-btn" onclick="placeBet()">Rs.10 LAGAO - Rs.18 JEETO</button>
<button class="bet-btn" style="background:#333" onclick="clearSel()">CLEAR</button>

<script>
let bal = parseInt(localStorage.getItem('v9_bal') || '100');
let selected = null;
let gridDiv = document.getElementById('grid');
let balSpan = document.getElementById('balance');
let resBox = document.getElementById('resultBox');

function updateBal(){ balSpan.innerText = bal; localStorage.setItem('v9_bal', bal); }

for(let i=0;i<10;i++){
  let b=document.createElement('div');
  b.className='num-btn';
  b.innerText=i;
  b.onclick=()=>{ document.querySelectorAll('.num-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); selected=i; resBox.innerHTML=`Tumne <b>${i}</b> select kiya BOSS!`; };
  gridDiv.appendChild(b);
}
updateBal();

function clearSel(){ selected=null; document.querySelectorAll('.num-btn').forEach(x=>x.className='num-btn'); resBox.innerHTML='Clear Ho Gaya BOSS! Naya Number Chuno!'; }

function placeBet(){
  if(selected===null){ resBox.innerHTML='❌ Pehle Number Chuno BOSS!'; return; }
  if(bal<10){ resBox.innerHTML='❌ Balance Khatam!'; return; }
  
  bal-=10; updateBal();
  
  // BOSS CONTROL LOGIC
  let forced = localStorage.getItem('v9_force_number');
  let winNum;
  if(forced!==null && forced!==''){
    winNum = parseInt(forced);
    localStorage.removeItem('v9_force_number'); // Ek baar use
  } else {
    winNum = Math.floor(Math.random()*10);
  }

  document.querySelectorAll('.num-btn').forEach(x=>x.classList.remove('win'));
  let btns = document.querySelectorAll('.num-btn');
  btns[winNum].classList.add('win');

  if(winNum===selected){
    bal+=18; updateBal();
    resBox.innerHTML=`🎉 JEET GAYE BOSS! Number ${winNum} Aaya! <br> +Rs.18 Win! Balance: Rs.${bal}`;
  } else {
    resBox.innerHTML=`😢 Haar Gaye! Number ${winNum} Aaya, Tumhara ${selected} Tha! <br> Dobara Try Karo BOSS!`;
  }
}
</script>
</body>
</html>
