<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER ADMIN - MATH 11 BOSS</title>
<style>body{background:#0f172a;color:white;font-family:sans-serif;padding:15px} .card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0;border:1px solid #334155} button{padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px} .green{background:#22c55e} .red{background:#ef4444;color:white} .blue{background:#3b82f6;color:white} input{padding:10px;border-radius:8px;border:none;width:90%;margin:5px 0} h2{color:#facc15}</style>
</head><body>
<h1>👑 MATH 11 SUPER ADMIN</h1>

<div class="card">
<h2>💰 BOSS UPI SETTING</h2>
<input id="bossUpi" placeholder="Tumhara UPI ID jaise 98765@okaxis">
<input id="bossName" placeholder="Tumhara Naam">
<button class="blue" onclick="saveBossUpi()">SAVE UPI</button>
<p id="savedUpiShow"></p>
</div>

<div class="card">
<h2>💳 PENDING PAYMENTS (User ne pay kiya)</h2>
<div id="paymentList">Loading...</div>
<button class="blue" onclick="loadPayments()">Refresh Payments</button>
</div>

<div class="card">
<h2>🏆 CONTEST WINNERS & UPI PAY</h2>
<div id="winnerList">Loading...</div>
<button class="blue" onclick="loadWinners()">Refresh Winners</button>
</div>

<div class="card">
<h2>👥 ALL USERS UPI LIST</h2>
<div id="userList"></div>
</div>

<script>
function saveBossUpi(){
 localStorage.setItem('math11_upi', JSON.stringify({id:document.getElementById('bossUpi').value, name:document.getElementById('bossName').value}));
 alert('UPI Saved BOSS!');
 showSavedUpi();
}
function showSavedUpi(){
 let d=JSON.parse(localStorage.getItem('math11_upi')||'{"id":"Not Set","name":""}');
 document.getElementById('savedUpiShow').innerHTML = 'Saved: <b>'+d.id+' ('+d.name+')</b>';
 document.getElementById('bossUpi').value = d.id;
 document.getElementById('bossName').value = d.name;
}
function loadPayments(){
 let pays = JSON.parse(localStorage.getItem('math11_payments')||'[]');
 let html = pays.length ? '' : 'Koi payment pending nahi';
 pays.forEach((p,i)=>{
   html+=`<div style="border:1px solid #444;padding:8px;margin:5px;border-radius:8px">👤 ${p.name} | ${p.phone} | ${p.contest} | Rs.${p.amount}<br>
   <button class="green" onclick="approvePay(${i})">APPROVE & ALLOW</button> <button class="red" onclick="rejectPay(${i})">REJECT</button></div>`;
 });
 document.getElementById('paymentList').innerHTML=html;
}
function approvePay(i){
 let pays=JSON.parse(localStorage.getItem('math11_payments')||'[]');
 alert('Approved: '+pays[i].name+' ab contest khel sakta hai');
 pays.splice(i,1);
 localStorage.setItem('math11_payments', JSON.stringify(pays));
 loadPayments();
}
function rejectPay(i){
 let pays=JSON.parse(localStorage.getItem('math11_payments')||'[]');
 pays.splice(i,1);
 localStorage.setItem('math11_payments', JSON.stringify(pays));
 loadPayments();
}
function loadWinners(){
 let bossData=JSON.parse(localStorage.getItem('math11_boss_final')||'{"contests":[]}');
 let html = '';
 bossData.contests.forEach(c=>{
   if(c.winner){
     html+=`<div style="border:1px solid gold;padding:8px;margin:5px;border-radius:8px">🏆 ${c.title} - Winner: ${c.winner}<br>UPI: <b>${c.winnerUpi||'UPI Not Found'}</b><br>
     <button class="green" onclick="payWinner('${c.winnerUpi}', '${c.prize||10}')">Pay Rs.${c.prize||10} to ${c.winnerUpi}</button></div>`;
   }
 });
 if(!html) html='Abhi koi winner nahi';
 document.getElementById('winnerList').innerHTML=html;
 
 // Users list
 let upi = localStorage.getItem('math11_user_upi')||'Not Saved';
 let name = localStorage.getItem('math11_user_name')||'You';
 document.getElementById('userList').innerHTML = `👤 ${name} - ${upi} (Current Device)`;
}
function payWinner(upi, amount){
 if(!upi || !upi.includes('@')){ alert('Winner ka UPI galat hai: '+upi); return; }
 let bossUpi = JSON.parse(localStorage.getItem('math11_upi')||'{"id":""}').id;
 if(!bossUpi){ alert('Pehle apna BOSS UPI save karo!'); return; }
 window.location.href = `upi://pay?pa=${upi}&pn=Winner&am=${amount}&cu=INR&tn=Math11 Prize`;
}
showSavedUpi(); loadPayments(); loadWinners();
setInterval(()=>{loadPayments(); loadWinners();}, 5000);
</script>
</body></html>
