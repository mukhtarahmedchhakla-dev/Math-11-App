<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATH-11 FANTASY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff}
.header{background:#1e293b;padding:15px;display:flex;justify-content:space-between}
.logo{font-weight:800;font-size:22px;color:#22c55e}
.wallet{background:#22c55e;color:#000;padding:6px 14px;border-radius:20px;font-weight:700}
.contest-card{background:#1e293b;margin:12px;border-radius:12px;padding:14px;border:1px solid #334155}
.contest-top{display:flex;justify-content:space-between}
.prize{color:#22c55e;font-weight:800;font-size:18px}
.entry-btn{background:#22c55e;color:#000;border:none;padding:8px 18px;border-radius:8px;font-weight:800;cursor:pointer}
.chapter{display:flex;justify-content:space-between;background:#1e293b;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #334155;cursor:pointer}
.chapter.selected{border-color:#22c55e;background:#14532d}
.q-area{background:#fff;color:#000;margin:12px;border-radius:12px;padding:16px;display:none}
.opt{padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;cursor:pointer}
.opt:hover{background:#f0fdf4}
.row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #334155}
</style>
</head>
<body>
<div class="header"><div class="logo">📚 MATH-11 FANTASY</div><div class="wallet">Rs.100</div></div>

<div id="lobby">
<div class="contest-card">
<div class="contest-top"><div><b>Mega Contest</b><br><small>6 Questions • 5 Min</small></div><div class="prize">₹1000</div></div>
<div style="margin:10px 0;height:6px;background:#334155;border-radius:4px"><div style="width:75%;height:100%;background:#22c55e"></div></div>
<div style="display:flex;justify-content:space-between"><small>750 Left</small><button class="entry-btn" onclick="openTeam()">Rs.10 JOIN</button></div>
</div>

<div class="contest-card">
<div class="contest-top"><div><b>Practice Contest</b><br><small>Free</small></div><div class="prize">₹100</div></div>
<div style="display:flex;justify-content:space-between;margin-top:8px"><small>Unlimited</small><button class="entry-btn" style="background:#fff" onclick="openTeam()">FREE JOIN</button></div>
</div>

<div style="background:#1e293b;margin:12px;border-radius:12px;padding:12px">
<b>🏆 Leaderboard</b>
<div class="row"><span>1. Arjun - 240 pts</span><span>Rs.1000</span></div>
<div class="row"><span>2. Sana - 200 pts</span><span>Rs.500</span></div>
<div class="row"><span>3. You - 0 pts</span><span>-</span></div>
</div>
</div>

<div id="team" style="display:none;padding:12px">
<h3>Team Banao - 6+ Chapters Chuno</h3>
<div id="chapters"></div>
<button class="entry-btn" style="width:100%;margin-top:12px;padding:12px" onclick="startQuiz()">CONTEST START →</button>
</div>

<div id="quiz" class="q-area">
<h3 id="qno"></h3><p id="qtext" style="margin:10px 0;font-weight:600"></p>
<div id="opts"></div>
<div style="margin-top:12px;display:flex;justify-content:space-between"><span>Timer</span><span id="score">Score: 0</span></div>
</div>

<script>
const chList=["Complex Numbers","Functions","Quadratic","Matrices","Partial Fractions","Sequence","Permutation","Binomial","Polynomials","Trig Identities","Trig Graphs","Limit","Differentiation","Vectors"];
let selected=[],questions=[],qi=0,score=0;
const qsBank=[
{q:"i² = ?",o:["1","-1","0","i"],a:1},
{q:"Domain √(x-1)?",o:["x≥1","x>1","x≤1","All"],a:0},
{q:"Det of I 3x3?",o:["0","1","3","-1"],a:1},
{q:"Sum 1 to n?",o:["n(n+1)/2","n²","n(n-1)/2","None"],a:0},
{q:"nPr = ?",o:["n!/(n-r)!","n!/r!","None","n!"],a:0},
{q:"(a+b)²?",o:["a²+b²+2ab","a²+b²","a²+b²-ab","None"],a:0},
{q:"sinx/x →0 ?",o:["0","1","∞","-1"],a:1},
{q:"d/dx x²?",o:["x","2x","x²","2"],a:1},
{q:"sin²+cos²?",o:["0","1","2","-1"],a:1},
{q:"a·b?",o:["|a||b|cosθ","|a||b|sinθ","|a|+|b|","None"],a:0}
];
function renderCh(){let h="";chList.forEach((c,i)=>{let sel=selected.includes(i);h+=`<div class="chapter ${sel?'selected':''}" onclick="toggleCh(${i})"><span>${i+1}. ${c}</span><span>${sel?'✓':'+'}</span></div>`;});document.getElementById("chapters").innerHTML=h;}
function toggleCh(i){if(selected.includes(i))selected=selected.filter(x=>x!=i);else selected.push(i);renderCh();}
function openTeam(){document.getElementById("lobby").style.display="none";document.getElementById("team").style.display="block";renderCh();}
function startQuiz(){if(selected.length<6){alert("6 chuno BOSS!");return;}questions=[...qsBank].sort(()=>0.5-Math.random()).slice(0,6);qi=0;score=0;document.getElementById("team").style.display="none";document.getElementById("quiz").style.display="block";showQ();}
function showQ(){if(qi>=questions.length){alert(`Khatam BOSS! Score: ${score}`);location.reload();return;}let q=questions[qi];document.getElementById("qno").innerText=`Q ${qi+1}/${questions.length}`;document.getElementById("qtext").innerText=q.q;let oh="";q.o.forEach((op,idx)=>{oh+=`<div class="opt" onclick="ans(${idx})">${op}</div>`});document.getElementById("opts").innerHTML=oh;}
function ans(idx){if(idx==questions[qi].a)score+=40;qi++;document.getElementById("score").innerText=`Score: ${score}`;showQ();}
renderCh();
</script>
</body>
</html>
