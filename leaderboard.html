<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard - Math 11</title><style>body{background:#0f172a;color:white;font-family:sans-serif;padding:15px} .top1{background:linear-gradient(45deg,gold,#facc15);color:black} .top2{background:linear-gradient(45deg,silver,#e5e7eb);color:black} .top3{background:linear-gradient(45deg,#cd7f32,#fbbf24);color:black} .row{display:flex;justify-content:space-between;padding:12px;margin:8px 0;border-radius:10px;background:#1e293b} button{padding:10px;background:#3b82f6;color:white;border:none;border-radius:8px}</style></head><body>
<h1>🏆 TOP MATH CHAMPIONS</h1><button onclick="location.href='index.html'">Back to App</button>
<div id="board">Loading...</div>
<script>
function loadBoard(){ let data=JSON.parse(localStorage.getItem('math11_boss_final')||'{"contests":[]}'); let winners={}; data.contests.forEach(c=>{ if(c.winner){ winners[c.winner]=(winners[c.winner]||0)+parseInt(c.prize||10); } }); let sorted=Object.entries(winners).sort((a,b)=>b[1]-a[1]); let html=''; sorted.slice(0,20).forEach((w,i)=>{ let cls=i==0?'top1':i==1?'top2':i==2?'top3':''; let medal=i==0?'🥇':i==1?'🥈':i==2?'🥉':`#${i+1}`; html+=`<div class="row ${cls}"><span>${medal} ${w[0]}</span><span>Rs.${w[1]}</span></div>`; }); if(!html) html='<p style="text-align:center;margin-top:30px">Abhi koi winner nahi, tum ban jao pehle champion!</p>'; document.getElementById('board').innerHTML=html; } loadBoard();
</script></body></html>
