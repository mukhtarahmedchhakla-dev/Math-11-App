<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOSS PANEL - Math 11</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#020617;color:white;padding:10px;max-width:600px;margin:auto}
h1{text-align:center;color:#38bdf8;font-size:22px}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:12px;border:1px solid #334155}
label{font-size:12px;color:#94a3b8;font-weight:bold;margin-top:8px;display:block}
input,textarea,select{width:100%;padding:9px;margin-top:4px;border-radius:8px;background:#0f172a;color:white;border:1px solid #334155}
button{padding:10px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-blue{background:#38bdf8;color:#000;width:100%}
.btn-green{background:#22c55e;color:#000;width:100%}
.btn-red{background:#ef4444;color:white}
.btn-small{font-size:12px;padding:6px 10px}
.row{display:flex;gap:8px}
.flex1{flex:1}
.contest-item{background:#0f172a;padding:10px;border-radius:10px;margin-bottom:8px;border-left:4px solid #38bdf8}
.q-item{background:#020617;padding:8px;border-radius:8px;margin:6px 0;border:1px dashed #334155}
.hidden{display:none}
.badge{font-size:10px;background:#38bdf8;color:#000;padding:2px 6px;border-radius:20px}
</style>
</head>
<body>
<h1>👑 BOSS PANEL<br><span style="font-size:12px;color:#64748b">Math 11 - FULL CONTROL</span></h1>

<div id="login" class="card">
<label>Password</label>
<input type="password" id="pass" placeholder="math11@123">
<button class="btn-blue" onclick="login()">LOGIN AS BOSS</button>
</div>

<div id="main" class="hidden">
<div class="card">
<div class="row">
<button class="btn-blue flex1" onclick="addContest()">+ NEW CONTEST</button>
<button class="btn-green flex1" onclick="saveBoss()">💾 SAVE ALL</button>
</div>
<p id="status" style="text-align:center;color:#22c55e;display:none">✅ SAVED - App Updated!</p>
</div>

<div id="contestList"></div>

<div class="card">
<h3>⚙️ APP SETTINGS (Global)</h3>
<label>App Notice (Sabko dikhega)</label><textarea id="globalNotice" rows="2"></textarea>
<label>Maintenance ON/OFF</label>
<select id="maintenance"><option value="off">OFF - App Chalega</option><option value="on">ON - App Band</option></select>
</div>

<div class="card">
<h4>📄 Final JSON (App ye padhega)</h4>
<pre id="jsonPreview" style="background:#000;padding:8px;border-radius:8px;font-size:10px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto"></pre>
</div>
</div>

<script>
const PASS="math11@123";
let data = JSON.parse(localStorage.getItem('math11_boss_final')||'{"contests":[],"globalNotice":"","maintenance":"off"}');

function login(){
 if(document.getElementById('pass').value!==PASS) return alert('Wrong Password');
 document.getElementById('login').classList.add('hidden');
 document.getElementById('main').classList.remove('hidden');
 render();
}

function addContest(){
 const id = Date.now();
 data.contests.push({id:id,title:"Contest "+(data.contests.length+1),prize:80,entry:50,joined:2,endTime:"",status:"active",winner:"",questions:[{q:"",A:"",B:"",C:"",D:"",ans:"A"}]});
 render();
}

function addQuestion(cIndex){
 data.contests[cIndex].questions.push({q:"",A:"",B:"",C:"",D:"",ans:"A"});
 render();
}

function deleteContest(cIndex){ if(confirm('Delete this contest?')){ data.contests.splice(cIndex,1); render(); } }
function deleteQuestion(cIndex,qIndex){ data.contests[cIndex].questions.splice(qIndex,1); render(); }

function render(){
 const list = document.getElementById('contestList');
 list.innerHTML="";
 data.contests.forEach((c,i)=>{
  let qsHtml = c.questions.map((q,qi)=>`
   <div class="q-item">
    <div class="row"><span class="badge">Q${qi+1}</span><button class="btn-red btn-small" style="margin-left:auto" onclick="deleteQuestion(${i},${qi})">X</button></div>
    <label>Sawal</label><textarea oninput="data.contests[${i}].questions[${qi}].q=this.value;updateJson()">${q.q}</textarea>
    <div class="row"><div class="flex1"><label>A</label><input value="${q.A}" oninput="data.contests[${i}].questions[${qi}].A=this.value;updateJson()"></div><div class="flex1"><label>B</label><input value="${q.B}" oninput="data.contests[${i}].questions[${qi}].B=this.value;updateJson()"></div></div>
    <div class="row"><div class="flex1"><label>C</label><input value="${q.C}" oninput="data.contests[${i}].questions[${qi}].C=this.value;updateJson()"></div><div class="flex1"><label>D</label><input value="${q.D}" oninput="data.contests[${i}].questions[${qi}].D=this.value;updateJson()"></div></div>
    <label>Correct</label><select onchange="data.contests[${i}].questions[${qi}].ans=this.value;updateJson()"><option ${q.ans=='A'?'selected':''}>A</option><option ${q.ans=='B'?'selected':''}>B</option><option ${q.ans=='C'?'selected':''}>C</option><option ${q.ans=='D'?'selected':''}>D</option></select>
   </div>
  `).join('');
  list.innerHTML+=`
  <div class="contest-item">
   <div class="row"><input value="${c.title}" style="font-weight:bold" oninput="data.contests[${i}].title=this.value;updateJson()"><button class="btn-red btn-small" onclick="deleteContest(${i})">DELETE</button></div>
   <div class="row"><div class="flex1"><label>Prize</label><input type="number" value="${c.prize}" oninput="data.contests[${i}].prize=this.value;updateJson()"></div><div class="flex1"><label>Entry</label><input type="number" value="${c.entry}" oninput="data.contests[${i}].entry=this.value;updateJson()"></div><div class="flex1"><label>Joined</label><input type="number" value="${c.joined}" oninput="data.contests[${i}].joined=this.value;updateJson()"></div></div>
   <label>End Time</label><input type="datetime-local" value="${c.endTime}" oninput="data.contests[${i}].endTime=this.value;updateJson()">
   <div class="row"><div class="flex1"><label>Status</label><select onchange="data.contests[${i}].status=this.value;updateJson()"><option value="active" ${c.status=='active'?'selected':''}>ACTIVE</option><option value="off" ${c.status=='off'?'selected':''}>OFF</option></select></div><div class="flex1"><label>Winner</label><input value="${c.winner}" oninput="data.contests[${i}].winner=this.value;updateJson()"></div></div>
   <h4 style="margin:10px 0 5px">Questions (${c.questions.length})</h4>
   ${qsHtml}
   <button class="btn-small" style="background:#334155;color:white;width:100%" onclick="addQuestion(${i})">+ Add Sawal in this Contest</button>
  </div>`;
 });
 document.getElementById('globalNotice').value=data.globalNotice||"";
 document.getElementById('maintenance').value=data.maintenance||"off";
 updateJson();
}

function updateJson(){
 data.globalNotice=document.getElementById('globalNotice').value;
 data.maintenance=document.getElementById('maintenance').value;
 document.getElementById('jsonPreview').innerText=JSON.stringify(data,null,2);
}

function saveBoss(){
 localStorage.setItem('math11_boss_final',JSON.stringify(data));
 // compatibility with old app
 localStorage.setItem('math11_full_contest',JSON.stringify(data.contests[0]||{}));
 localStorage.setItem('math11_contest',JSON.stringify(data.contests[0]||{}));
 updateJson();
 document.getElementById('status').style.display='block';
 setTimeout(()=>document.getElementById('status').style.display='none',2500);
}
</script>
</body>
</html>
